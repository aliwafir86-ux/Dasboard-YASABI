<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Evaluasi - Yayasan Sarana Berbagi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = window.__firebase_config ? JSON.parse(window.__firebase_config) : { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = window.__app_id || "dashboard-yayasan-01";

        // Ekspos ke global agar bisa diakses oleh script biasa
        window.db = db;
        window.auth = auth;
        window.appId = appId;
        window.firestoreUtils = { collection, onSnapshot, query, addDoc, deleteDoc, doc, getDoc, setDoc };
        
        // Auto sign-in
        signInAnonymously(auth).then(() => {
            console.log("Authenticated anonymously");
            window.listenStaff(); // Mulai mendengarkan data setelah auth siap
        }).catch(err => console.error("Auth error:", err));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .input-field { border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 14px; width: 100%; transition: all 0.2s; background: #fbfcfd; font-size: 0.875rem; }
        .input-field:focus { border-color: #3b82f6; background: white; outline: none; ring: 2px; ring-color: #dbeafe; }
        .ai-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Top Navigation -->
    <nav class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg">SB</div>
                <div>
                    <h1 class="text-md font-bold text-slate-800">Yayasan Sarana Berbagi</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest">Dashboard Monitoring</p>
                </div>
            </div>
            <div id="ai-status" class="hidden items-center gap-2 px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold border border-indigo-100">
                <span class="animate-ping h-2 w-2 rounded-full bg-indigo-400"></span>
                AI Processing
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- Main Tabs -->
        <div class="flex gap-8 border-b mb-8 overflow-x-auto no-scrollbar">
            <button onclick="switchMainTab('overview')" id="mtab-overview" class="pb-4 font-bold text-sm transition-all tab-active">Ringkasan</button>
            <button onclick="switchMainTab('evaluasi')" id="mtab-evaluasi" class="pb-4 font-bold text-sm transition-all text-slate-400">Evaluasi & Karyawan</button>
            <button onclick="switchMainTab('program')" id="mtab-program" class="pb-4 font-bold text-sm transition-all text-slate-400">Program Kerja</button>
        </div>

        <!-- SECTION: OVERVIEW -->
        <div id="section-overview" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="glass-card p-6">
                    <p class="text-xs font-bold text-slate-400 uppercase">Donasi Terkumpul</p>
                    <div class="flex items-baseline gap-1 mt-2">
                        <span class="text-sm font-bold text-slate-400">Rp</span>
                        <input type="text" id="stat-donasi" value="95" onchange="syncGlobalStats()" class="text-3xl font-black text-slate-800 w-20 bg-transparent outline-none border-b border-transparent hover:border-slate-200 focus:border-blue-500">
                        <span class="text-sm font-bold text-slate-800">Juta</span>
                    </div>
                </div>
                <div class="glass-card p-6">
                    <p class="text-xs font-bold text-slate-400 uppercase">Penerima Manfaat</p>
                    <input type="text" id="stat-penerima" value="1.240" onchange="syncGlobalStats()" class="text-3xl font-black text-slate-800 mt-2 w-full bg-transparent outline-none border-b border-transparent hover:border-slate-200 focus:border-blue-500">
                </div>
                <div class="glass-card p-6">
                    <p class="text-xs font-bold text-slate-400 uppercase">Program Aktif</p>
                    <h3 id="stat-program-count" class="text-3xl font-black text-slate-800 mt-2">0</h3>
                </div>
                <button onclick="generateDashboardInsight()" class="ai-gradient p-6 rounded-[24px] text-white text-left shadow-lg hover:opacity-90 transition-all">
                    <p class="text-xs font-bold uppercase opacity-80 mb-2">AI Advisor ✨</p>
                    <p class="text-sm font-medium">Analisis Kinerja Strategis Yayasan</p>
                </button>
            </div>
            
            <div id="dashboard-ai-result" class="hidden p-4 bg-indigo-50 border border-indigo-100 rounded-2xl text-sm text-indigo-900 leading-relaxed italic"></div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-card p-6">
                    <h4 class="font-bold text-slate-800 mb-6 flex items-center gap-2"><i class="fa-solid fa-chart-simple text-blue-600"></i> Tren Donasi Bulanan</h4>
                    <canvas id="overviewChart" height="220"></canvas>
                </div>
                <div class="glass-card p-6">
                    <h4 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-orange-500"></i> Aktivitas Terbaru</h4>
                    <div id="activity-log" class="space-y-4">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION: EVALUASI & KARYAWAN -->
        <div id="section-evaluasi" class="hidden space-y-6">
            <div class="glass-card overflow-hidden">
                <div class="bg-slate-50 px-8 py-4 border-b flex justify-between items-center">
                    <h3 class="font-bold text-slate-800">Form Identitas & Evaluasi Karyawan</h3>
                    <div class="flex gap-2">
                        <button onclick="resetStaffForm()" class="text-xs font-bold text-slate-500 px-3 py-1">Reset</button>
                    </div>
                </div>
                
                <div class="p-8">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">Nama Karyawan</label>
                            <input type="text" id="eval-nama" placeholder="Contoh: Wanda Herdiana" class="input-field">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">NIK / ID Karyawan</label>
                            <input type="text" id="eval-nik" placeholder="88120..." class="input-field">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">Jabatan</label>
                            <input type="text" id="eval-jabatan" placeholder="Program Office" class="input-field">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">Divisi / Unit</label>
                            <input type="text" id="eval-divisi" value="Yayasan Sarana Berbagi" class="input-field">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">Periode Penilaian</label>
                            <input type="text" id="eval-periode" placeholder="Semester 1 - 2026" class="input-field">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">Evaluator (Atasan)</label>
                            <input type="text" id="eval-atasan" placeholder="Nama Manager" class="input-field">
                        </div>
                    </div>

                    <div class="flex flex-col md:flex-row gap-4 border-t pt-8">
                        <button onclick="saveStaffToCloud()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-700 shadow-lg shadow-blue-100">
                            <i class="fa-solid fa-floppy-disk"></i> Simpan Identitas
                        </button>
                        <button onclick="analyzeStaffAI()" class="ai-gradient text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 shadow-lg shadow-indigo-100">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Evaluasi AI Berdasarkan Job Desc ✨
                        </button>
                    </div>

                    <div id="staff-ai-result" class="hidden mt-6 p-6 bg-slate-50 border rounded-2xl text-sm leading-relaxed text-slate-700"></div>
                </div>
            </div>

            <!-- Daftar Karyawan Tersimpan -->
            <div class="glass-card p-6">
                <h4 class="font-bold text-slate-800 mb-4">Daftar Karyawan Aktif</h4>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                            <tr>
                                <th class="px-6 py-3">Nama & Jabatan</th>
                                <th class="px-6 py-3">NIK</th>
                                <th class="px-6 py-3">Update Terakhir</th>
                                <th class="px-6 py-3 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="staff-list-body" class="divide-y divide-slate-50">
                            <!-- Diisi oleh JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECTION: PROGRAM -->
        <div id="section-program" class="hidden">
            <div class="glass-card overflow-hidden">
                <div class="p-6 border-b flex justify-between items-center">
                    <h3 class="font-bold text-slate-800">Monitoring Program Sosial</h3>
                    <button onclick="toggleAddProgram()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Tambah Program</button>
                </div>
                <div id="add-program-form" class="hidden p-6 bg-slate-50 border-b">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input id="new-prog-name" type="text" placeholder="Nama Program" class="input-field">
                        <input id="new-prog-val" type="number" placeholder="Progres (%)" class="input-field">
                        <button onclick="addNewProgram()" class="bg-blue-600 text-white rounded-xl font-bold text-xs">Simpan</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <tbody id="program-list-body" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- DATA STATE ---
        let currentPrograms = [
            { id: 1, name: "Beasiswa Sarana Berbagi", progress: 85 },
            { id: 2, name: "Sembako Lansia Dhuafa", progress: 40 },
            { id: 3, name: "Renovasi Rumah Qur'an", progress: 15 }
        ];

        const apiKey = "";

        // --- CORE NAVIGATION ---
        function switchMainTab(id) {
            ['overview', 'evaluasi', 'program'].forEach(t => {
                const section = document.getElementById('section-' + t);
                const tab = document.getElementById('mtab-' + t);
                if(section) section.classList.add('hidden');
                if(tab) {
                    tab.classList.remove('tab-active');
                    tab.classList.add('text-slate-400');
                }
            });
            const targetSection = document.getElementById('section-' + id);
            const targetTab = document.getElementById('mtab-' + id);
            if(targetSection) targetSection.classList.remove('hidden');
            if(targetTab) {
                targetTab.classList.add('tab-active');
                targetTab.classList.remove('text-slate-400');
            }
        }

        // --- LOGIC: DASHBOARD STATS ---
        function syncGlobalStats() {
            const donasi = document.getElementById('stat-donasi').value;
            const penerima = document.getElementById('stat-penerima').value;
            localStorage.setItem('sb_stats', JSON.stringify({ donasi, penerima }));
        }

        function renderPrograms() {
            const container = document.getElementById('program-list-body');
            if(!container) return;
            document.getElementById('stat-program-count').innerText = currentPrograms.length;
            container.innerHTML = currentPrograms.map(p => `
                <tr class="hover:bg-slate-50/50">
                    <td class="px-6 py-4 font-bold text-slate-700 text-sm">${p.name}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div class="bg-blue-500 h-full transition-all" style="width: ${p.progress}%"></div>
                            </div>
                            <span class="text-[10px] font-black text-slate-400">${p.progress}%</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteProgram(${p.id})" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function toggleAddProgram() { 
            const form = document.getElementById('add-program-form');
            if(form) form.classList.toggle('hidden'); 
        }

        function addNewProgram() {
            const name = document.getElementById('new-prog-name').value;
            const val = document.getElementById('new-prog-val').value;
            if(name && val) {
                currentPrograms.push({ id: Date.now(), name, progress: val });
                renderPrograms();
                toggleAddProgram();
            }
        }

        function deleteProgram(id) {
            currentPrograms = currentPrograms.filter(p => p.id !== id);
            renderPrograms();
        }

        // --- LOGIC: EVALUASI KARYAWAN & CLOUD ---
        window.listenStaff = function() {
            if (!window.db || !window.firestoreUtils) return;
            const { collection, onSnapshot, query } = window.firestoreUtils;
            const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'karyawan');
            onSnapshot(colRef, (snapshot) => {
                const list = [];
                snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                renderStaffTable(list);
            }, (err) => console.error("Listen staff error:", err));
        }

        async function saveStaffToCloud() {
            const data = {
                nama: document.getElementById('eval-nama').value,
                nik: document.getElementById('eval-nik').value,
                jabatan: document.getElementById('eval-jabatan').value,
                divisi: document.getElementById('eval-divisi').value,
                periode: document.getElementById('eval-periode').value,
                atasan: document.getElementById('eval-atasan').value,
                updatedAt: new Date().toLocaleDateString('id-ID')
            };

            if(!data.nama || !data.nik) return alert("Nama dan NIK wajib diisi.");

            try {
                const { collection, addDoc } = window.firestoreUtils;
                const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'karyawan');
                await addDoc(colRef, data);
                alert("Identitas karyawan berhasil disimpan!");
                resetStaffForm();
            } catch (e) {
                console.error("Save error:", e);
                alert("Gagal menyimpan data.");
            }
        }

        function renderStaffTable(list) {
            const container = document.getElementById('staff-list-body');
            if(!container) return;
            container.innerHTML = list.map(s => `
                <tr class="hover:bg-slate-50">
                    <td class="px-6 py-4">
                        <div class="font-bold text-slate-800 text-sm">${s.nama}</div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase">${s.jabatan}</div>
                    </td>
                    <td class="px-6 py-4 text-xs text-slate-600 font-medium">${s.nik}</td>
                    <td class="px-6 py-4 text-xs text-slate-400">${s.updatedAt}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteStaff('${s.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteStaff(id) {
            if(confirm("Hapus data karyawan ini?")) {
                try {
                    const { doc, deleteDoc } = window.firestoreUtils;
                    await deleteDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'karyawan', id));
                } catch(e) {
                    console.error("Delete error:", e);
                }
            }
        }

        function resetStaffForm() {
            ['eval-nama', 'eval-nik', 'eval-jabatan', 'eval-periode', 'eval-atasan'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.value = "";
            });
            const result = document.getElementById('staff-ai-result');
            if(result) result.classList.add('hidden');
        }

        // --- AI LOGIC ---
        async function callAI(prompt) {
            const status = document.getElementById('ai-status');
            if(status) {
                status.classList.remove('hidden');
                status.classList.add('flex');
            }
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, AI sedang tidak responsif.";
            } catch (e) {
                return "Gagal menghubungi AI.";
            } finally {
                if(status) status.classList.add('hidden');
            }
        }

        async function analyzeStaffAI() {
            const nama = document.getElementById('eval-nama').value;
            const jabatan = document.getElementById('eval-jabatan').value;
            if(!nama) return alert("Isi nama karyawan dulu!");

            const resultBox = document.getElementById('staff-ai-result');
            if(!resultBox) return;
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = "<div class='animate-pulse'>Menganalisis kompetensi berdasarkan Job Description...</div>";

            const prompt = `Evaluasi karyawan bernama ${nama} dengan jabatan ${jabatan} di Yayasan Sarana Berbagi. Berikan analisis singkat tentang 3 poin kompetensi utama yang harus dimiliki sesuai standar operasional yayasan sosial. Gunakan bahasa yang sopan dan profesional.`;
            
            const res = await callAI(prompt);
            resultBox.innerHTML = `<div class="font-bold mb-2 text-indigo-600"><i class="fa-solid fa-robot"></i> Analisis AI:</div>${res}`;
        }

        async function generateDashboardInsight() {
            const donasi = document.getElementById('stat-donasi').value;
            const resBox = document.getElementById('dashboard-ai-result');
            if(!resBox) return;
            resBox.classList.remove('hidden');
            resBox.innerText = "Menghitung proyeksi pertumbuhan...";
            
            const prompt = `Yayasan Sarana Berbagi saat ini memiliki total donasi Rp ${donasi} Juta. Berikan 1 saran strategis singkat untuk meningkatkan transparansi laporan kepada donatur agar donasi bulan depan meningkat.`;
            const res = await callAI(prompt);
            resBox.innerHTML = `<strong>Rekomendasi Strategis:</strong> ${res}`;
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            renderPrograms();
            
            // Inisialisasi listenStaff jika auth sudah siap atau dipanggil otomatis dari modul
            if(window.db && window.firestoreUtils) {
                window.listenStaff();
            }

            // Chart JS
            const chartEl = document.getElementById('overviewChart');
            if(chartEl) {
                const ctx = chartEl.getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'],
                        datasets: [{
                            label: 'Donasi (Juta)',
                            data: [12, 19, 15, 25, 22, 30],
                            borderColor: '#2563eb',
                            backgroundColor: 'rgba(37, 99, 235, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true }, x: { grid: { display: false } } }
                    }
                });
            }

            const log = document.getElementById('activity-log');
            if(log) {
                log.innerHTML = `
                    <div class="flex gap-4 p-3 hover:bg-slate-50 rounded-xl transition-all">
                        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs"><i class="fa-solid fa-plus"></i></div>
                        <div><p class="text-xs font-bold text-slate-700">Donasi Masuk Baru</p><p class="text-[10px] text-slate-400">Rp 5.000.000 dari Hamba Allah</p></div>
                    </div>
                    <div class="flex gap-4 p-3 hover:bg-slate-50 rounded-xl transition-all">
                        <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-xs"><i class="fa-solid fa-check"></i></div>
                        <div><p class="text-xs font-bold text-slate-700">Program Selesai</p><p class="text-[10px] text-slate-400">Penyaluran Paket Sembako Tahap 1</p></div>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
